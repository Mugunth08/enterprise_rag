version = "0.1.0"
description = "Enterprise Production RAG System using LangChain, Gemini, and ChromaDB"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "deepeval>=4.1.4",
    "langchain>=1.3.14",
    "langchain-chroma>=1.1.0",
    "langchain-community>=0.4.2",
    "langchain-google-genai>=4.3.2",
    "langchain-google-vertexai>=3.2.4",
    "langchain-text-splitters>=1.1.2",
    "pymupdf>=1.28.0",
    "pypdf>=6.14.2",
]
